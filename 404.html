<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Viventia — Legal</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      :root { --bg:#f7f7f4; --ink:#16181a; --sub:#43474a; --accent:#2e7d6e; }
      @media (prefers-color-scheme: dark) {
        :root { --bg:#0e0f10; --ink:#eceeee; --sub:#c2c8c6; --accent:#4fa891; }
      }
      body { margin:0; padding:3rem 1.15rem; background:var(--bg); color:var(--sub);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        font-size:17px; line-height:1.65; }
      main { max-width:34rem; margin:0 auto; }
      h1 { margin:0 0 .5rem; font-size:1.6rem; color:var(--ink); letter-spacing:-.02em; }
      a { color:var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>That address does not exist on this site.</p>
      <p><a href="/viv-legal/privacy/">Viventia Privacy Policy</a></p>
    </main>
  </body>
</html>
