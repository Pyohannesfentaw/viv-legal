<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Viventia — Legal</title>
    <meta name="description" content="Legal documents for Viventia." />
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        --bg: #f7f7f4;
        --ink: #16181a;
        --sub: #43474a;
        --muted: #6d7270;
        --accent: #2e7d6e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e0f10;
          --ink: #eceeee;
          --sub: #c2c8c6;
          --muted: #949a98;
          --accent: #4fa891;
        }
      }
      body {
        margin: 0;
        padding: 3rem 1.15rem;
        background: var(--bg);
        color: var(--sub);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        font-size: 17px;
        line-height: 1.65;
      }
      main {
        max-width: 34rem;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 2rem;
        letter-spacing: -0.02em;
        color: var(--ink);
      }
      a {
        color: var(--accent);
      }
      ul {
        padding-left: 1.35rem;
      }
      li {
        margin: 0.5rem 0;
      }
      .meta {
        color: var(--muted);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Viventia</h1>
      <p class="meta">Legal documents</p>
      <ul>
        <li><a href="./privacy/">Privacy Policy</a></li>
      </ul>
      <p class="meta">
        Published by Yohannes Fentaw, the Netherlands ·
        <a href="mailto:info.yobe.creative@gmail.com"
          >info.yobe.creative@gmail.com</a
        >
      </p>
    </main>
  </body>
</html>
