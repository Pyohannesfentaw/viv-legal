name: Deploy legal pages

# Publishes the privacy policy to GitHub Pages.
#
# This exists because Google Play rejects the listing the moment the privacy
# policy URL returns anything other than 200. Deploying from a workflow rather
# than from the legacy branch setting means every push redeploys, the run
# history shows what happened, and a broken site can be fixed by re-running a
# job instead of by rediscovering a setting.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in progress: the site being briefly absent is the one
# failure mode that matters here.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
